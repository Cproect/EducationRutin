const nm={},rn={};SUBJ.forEach(s=>{nm[s[0]]=s[1];rn[s[0]]=s[2]});

for(let d='2026-09-01';d<='2027-06-30';d=add(d,1)){const w=dowOf(d),o=off(d,w),x={d,dow:w,o,l:o?[]:TT[w],w:add(d,-((w+6)%7))};AD[d]=x;if(!o)days.push(x)}

function save(){const j=JSON.stringify(st);if(j===LAST)return;hist.push(LAST);if(hist.length>40)hist.shift();LAST=j;persist()}
let N,L,used,val,PW,PL,planCnt;
const sc=x=>x.l.reduce((a,i)=>a+val[i],0);
let MEAN=1;const LN=['','Обычный','Важный','Очень важный'];

const lvl=x=>{const o=st.dv[x.d];if(o)return o;const r=sc(x)/MEAN;let l=r<.9?1:r>1.1?3:2;if(x.d>=TODAY&&x.l.some(i=>L[i]-used[i]<=2))l=3;return l};

function calc(){
 N={};L={};used={};val={};PW={};planCnt={};SUBJ.forEach(s=>{N[s[0]]=0;used[s[0]]=0;planCnt[s[0]]=0});

 days.forEach(x=>x.l.forEach(i=>N[i]++));
 // ценность урока = важность × редкость (реже урок → ценнее)

 while(prog&&r<5){prog=false;
  const ord=Object.keys(wk).filter(w=>wk[w].c.length).sort().map((w,i)=>[w,(i*.618034+r*.37)%1]).sort((a,b)=>a[1]-b[1]);
  for(const[w]of ord){const o=wk[w];if(o.sk>=Math.max(0,o.all.length-st.minGo))continue;let b=null;

 // золотой запас: сколько ещё полных дней можно пропустить сверх плана (при реальных лимитах)
 const C={};SUBJ.forEach(s=>C[s[0]]=L[s[0]]-used[s[0]]-planCnt[s[0]]);

 let extra=0;
 days.filter(x=>x.d>=TODAY&&st.att[x.d]===undefined&&!P.has(x.d)).sort((a,b)=>dscore(a)-dscore(b)).forEach(x=>{if(x.l.every(i=>C[i]>=1)){x.l.forEach(i=>C[i]--);extra++}});

}

 const R2=[];[t&&!t.o?t:null,days.find(x=>x.d>TODAY)].forEach(x=>{if(x&&lvl(x)>=2&&st.att[x.d]!=='a'){const dd=Math.round((new Date(x.d)-new Date(TODAY))/864e5);R2.push(`<div class="rem l${lvl(x)}" onclick="openDay('${x.d}')"><b>${dd==0?'Сегодня':dd==1?'Завтра':DN[x.dow]+' '+fmt(x.d)}: ${LN[lvl(x)].toLowerCase()} день</b><div class="sm">${why(x)}</div></div>`)}});
 const bkw=Object.keys(st.att).length&&(!st.lx||Date.now()-st.lx>12096e5)?`<div class="rem" onclick="dl()"><b>Сохраните копию данных</b><div class="sm">Файл ${st.lx?'не скачивали больше 14 дней':'ещё ни разу не скачивали'}. Нажмите, чтобы скачать.</div></div>`:'';
 return R2.join('')+bkw+h+W.join('')+`<div class="card"><div class="row"><b>Золотой запас: ещё ${PL.extra} ${PL.extra%10==1&&PL.extra!=11?'день':'дн.'}</b></div><div class="m sm">Столько полных дней можно пропустить сверх плана без экстерна. План сам держит в запасе ${st.R} пропуска по каждому предмету.</div></div>
 <div class="card"><div class="m sm">Учебных дней: ${days.length}${days.length!=169?' (в календаре должно быть 169!)':''} · прошло ${past} · осталось ${days.length-past}<br>Полных пропусков отмечено: ${full} · запланировано: ${PL.P.size}<br>Ритм пропусков по плану: ${pat}</div></div>
 <div class="card"><h3>План по неделям</h3><div class="lg"><span class="pres">был / иду</span><span class="skip">план: пропуск</span><span class="abs">не был</span><span class="part">часть уроков</span><span class="go">иду по плану</span><span class="alt">запасной день для пропуска</span><span><i class="dot l1"></i>обычный<i class="dot l2"></i>важный<i class="dot l3"></i>очень важный</span></div><div class="m sm">Нажмите на день, чтобы отметить посещение — план перестроится сам. Число справа: дней в школе / учебных дней.</div>${wl}</div>`}
function v1(){let o=`<div class="lg"><span class="oh">праздник</span><span class="oy">весенние/пасхальные</span><span class="og">зимние/летние/до 15.09</span><span class="pres">был</span><span class="skip">план: пропуск</span><span class="abs">не был</span></div><div class="m sm" style="margin-bottom:8px">Цветные дни без уроков не учитываются в расчёте. Нажмите на учебный день, чтобы изменить отметку (в том числе в прошлом).</div>`;
 for(let m=8;m<18;m++){const y=2026+(m>11?1:0),mm=m%12,f=(new Date(Date.UTC(y,mm,1)).getUTCDay()+6)%7,n=new Date(Date.UTC(y,mm+1,0)).getUTCDate();let c=0,g='';
  for(let i=0;i<f;i++)g+='<div class="cd e"></div>';
  for(let i=1;i<=n;i++){const d=`${y}-${pad(mm+1)}-${pad(i)}`,x=AD[d],td=d==TODAY?' td':'';
   if(x.o)g+=`<div class="cd o${x.o[1]}${td}" onclick="warn('${d}')" title="${x.o[0]}">${i}</div>`;else{c++;g+=`<div class="cd ${cls(x)}${td}${d==FX?' pop':''}" onclick="openDay('${d}')">${i}<i class="dot l${lvl(x)}"></i></div>`}}
  o+=`<div class="card"><div class="row"><b>${MN[mm]} ${y}</b><span class="m sm">учебных дней: ${c}</span></div><div class="mo">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(a=>`<div class="hd">${a}</div>`).join('')}${g}</div></div>`}
 return o}
function v2(){return SUBJ.map(s=>{const i=s[0],u=used[i],l=L[i],pl=planCnt[i],rem=l-u,p=l?Math.min(100,u/l*100):100,c=rem<0?'r':rem<=2?'o':'g';
 return`<div class="card"><div class="row"><b>${s[1]}</b><span class="m sm">${s[2]}</span><span class="tag ${c}">${rem<0?'ЭКСТЕРН':'ост. '+rem}</span></div><div class="bar"><i class="${c}" style="width:${p}%"></i></div><div class="m sm">Пропущено ${u} из ${l} допустимых · всего уроков за год ${N[i]} (${PW[i]}/нед) · по плану +${pl} → ${u+pl}<br>Ценность урока: ${val[i].toFixed(1)}</div><label class="sm">Важность (0–10): <input type="number" min="0" max="10" step=".5" value="${st.imp[i]??s[3]}" onchange="imp('${i}',this.value)"></label></div>`}).join('')}
function v3(){return`<div class="card"><h3>Строгость плана</h3><div class="bt"><button onclick="pre(3,3)">Строго</button><button onclick="pre(2,2)">Мягко</button><button onclick="pre(1,1)">Свободно</button><button onclick="askN()">Напоминания</button></div><div class="m sm">Сейчас: запас ${st.R} пропуска на предмет, минимум ${st.minGo} дн. в школе в неделю. Строго — 3/3, мягко — 2/2, свободно — 1/1. Напоминания о важных днях показываются при открытии страницы.</div><h3 style="margin-top:14px">Параметры</h3>
<p><label>Лимит пропусков, % от всех уроков предмета: <input type="number" min="1" max="100" value="${st.lim}" onchange="cfg('lim',this.value)"></label></p>
<p><label>Золотой запас, пропусков на предмет: <input type="number" min="0" max="15" value="${st.R}" onchange="cfg('R',this.value)"></label></p>
<p><label>Минимум дней в школе за неделю: <input type="number" min="0" max="5" value="${st.minGo}" onchange="cfg('minGo',this.value)"></label></p></div>
${extraCards()}
<div class="card sm m"><b>Как считает модель.</b> Каждый урок имеет ценность = важность × редкость (5 ÷ уроков в неделю). Ценность дня — сумма ценностей его уроков: дни с редкими уроками дороже, дни с ежедневными дешевле. Лимит предмета = ${st.lim}% от всех его уроков за год. План выбирает дни пропуска с минимальной ценностью, равномерно по неделям, не трогая золотой запас, и пересобирается после каждой отметки.</div>`}
function render(){calc();$('#v0').innerHTML=v0();$('#v1').innerHTML=v1();$('#v2').innerHTML=v2();$('#v3').innerHTML=v3();FX=null;thIcon()}
function tab(n){document.querySelectorAll('.v').forEach((e,i)=>e.classList.toggle('on',i==n));document.querySelectorAll('nav button').forEach((e,i)=>e.classList.toggle('on',i==n));scrollTo(0,0)}
function warn(d){const x=AD[d],t=$('#ts');t.textContent=`${fmt(d)}: уроков нет — ${x.o[0]}. День не учитывается в расчёте.`;t.style.display='block';clearTimeout(warn.t);warn.t=setTimeout(()=>t.style.display='none',3800)}
function openDay(d){const x=AD[d],a=st.att[d],f=d>TODAY;
 $('#md').innerHTML=`<div class="box"><h3>${DN[x.dow]} ${fmt(d)}</h3><div class="m sm">${f?'Будущий день: можно зафиксировать вручную, план подстроится.':'Отметьте, как было.'}</div><p><button onclick="sa('${d}','p')">${f?'Пойду':'Был(а)'}</button><button onclick="sa('${d}','a')">${f?'Пропущу':'Не был(а)'}</button><button onclick="sa('${d}')">Авто</button></p><div class="imp l${lvl(x)}"><b>${LN[lvl(x)]} день${st.dv[d]?' (вручную)':''}</b><div class="sm">${why(x)}</div></div><div class="sm m">Задать важность дня:</div><p>${[['Авто',0],['Обычный',1],['Важный',2],['Очень важный',3]].map(a=>`<button onclick="sv('${d}',${a[1]})">${a[0]}</button>`).join('')}</p><div class="sm m">Или отметьте пропущенные уроки:</div>${x.l.map((i,k)=>`<label><input type="checkbox" value="${k}" ${Array.isArray(a)&&a.includes(k)?'checked':''}> ${k+1}. ${nm[i]}</label>`).join('')}<p><button onclick="sl('${d}')">Применить по урокам</button><button onclick="cl()">Закрыть</button></p></div>`;$('#md').classList.add('on')}
const cl=()=>$('#md').classList.remove('on');
function sa(d,v){if(v===undefined)delete st.att[d];else st.att[d]=v;FX=d;save();cl();render()}
function sl(d){const k=[...document.querySelectorAll('#md input:checked')].map(e=>+e.value);if(!k.length)delete st.att[d];else st.att[d]=k.length==AD[d].l.length?'a':k;FX=d;save();cl();render()}
const imp=(i,v)=>{st.imp[i]=+v;save();render()},cfg=(k,v)=>{st[k]=Math.max(0,+v||0);save();render()};
function exp(){const s=JSON.stringify(st);(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert('Скопировано'),()=>prompt('Скопируйте:',s))}
function imp2(){const s=prompt('Вставьте данные:');if(!s)return;try{const j=JSON.parse(s),th=st.th;snap(1);st=Object.assign(DEF(),j.data||j);st.th=th;save();render()}catch(e){alert('Не удалось прочитать данные')}}
const sv=(d,v)=>{if(v)st.dv[d]=v;else delete st.dv[d];save();render();openDay(d)};
const pre=(r,m)=>{st.R=r;st.minGo=m;save();render()};
function notif(){try{if(Notification.permission!=='granted')return;const x=days.find(y=>y.d>TODAY);if(x&&lvl(x)>=2&&st.nt!==TODAY){st.nt=TODAY;save();new Notification('Ближайший учебный день важный',{body:DN[x.dow]+' '+fmt(x.d)+': '+why(x)})}}catch(e){}}
function askN(){try{Notification.requestPermission().then(notif)}catch(e){alert('Браузер не поддерживает уведомления')}}
const dk=()=>{const t=document.documentElement.dataset.theme;return t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches)};
const thIcon=()=>{$('#thb').textContent=dk()?'☀':'☾'};
function applyTh(){document.documentElement.dataset.theme=st.th==='auto'?'':st.th;thIcon()}
const setTh=v=>{st.th=v;save();applyTh();render()},cycleTh=()=>setTh(dk()?'light':'dark');
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(warn.t);warn.t=setTimeout(()=>t.style.display='none',3200)}
function undo(){if(!hist.length)return toast('Нечего отменять');const th=st.th;st=JSON.parse(hist.pop());st.th=th;LAST=JSON.stringify(st);persist();applyTh();render();toast('Последнее действие отменено')}
function dl(){const b=new Blob([JSON.stringify({app:'sp2627',saved:new Date().toISOString(),data:st},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='attendance-11g-'+TODAY+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3);st.lx=Date.now();save();render();toast('Файл скачан')}
function up(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),o=j.data||j;if(!o||typeof o.att!=='object')throw 0;if(!confirm('Заменить текущие данные данными из файла? Текущие сохранятся в автокопиях.'))return;const th=st.th;snap(1);st=Object.assign(DEF(),o);st.th=th;save();render();toast('Данные загружены')}catch(e){alert('Не удалось прочитать файл')}};r.readAsText(f)}
function rs(i){try{const x=JSON.parse(localStorage.getItem(BK)||'[]')[i];if(!x||!confirm('Восстановить копию от '+new Date(x.t).toLocaleString('ru')+'?'))return;const th=st.th;snap(1);st=Object.assign(DEF(),JSON.parse(x.d));st.th=th;save();render();toast('Копия восстановлена')}catch(e){alert('Не удалось восстановить')}}
function extraCards(){let b=[];try{b=JSON.parse(localStorage.getItem(BK)||'[]')}catch(e){}
 const T=t=>new Date(t).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),n=Object.keys(st.att).length;
 return`<div class="card bt"><h3>Тема</h3>${[['auto','Авто'],['dark','Тёмная'],['light','Светлая']].map(a=>`<button ${st.th==a[0]?'style="border-color:var(--bl);color:var(--bl)"':''} onclick="setTh('${a[0]}')">${a[1]}</button>`).join('')}</div>
<div class="card bt"><h3>Память и копии</h3><div class="sm m">${memOK?'Автосохранение включено: каждое изменение сразу пишется в память браузера.':'⚠ Память браузера недоступна (приватный режим?). Скачивайте файл после правок.'}<br>Отметок: ${n} · сохранено: ${SAVEDAT?T(SAVEDAT):'—'} · файл скачан: ${st.lx?T(st.lx):'ещё не было'}</div>
<p><button onclick="dl()">⬇ Скачать файл</button><label class="fb">⬆ Загрузить файл<input type="file" accept=".json,application/json" hidden onchange="up(this.files[0]);this.value=''"></label><button onclick="undo()">↶ Отменить</button></p>
<p><button onclick="exp()">Скопировать текст</button><button onclick="imp2()">Вставить текст</button><button onclick="if(confirm('Стереть все отметки? Автокопии останутся.')){snap(1);st.att={};save();render()}">Сбросить отметки</button></p>
<div class="sm m">Автокопии (до 8, раз в 30 минут при правках):</div>${b.length?b.map((x,i)=>[x,i]).reverse().map(([x,i])=>`<div class="row sm" style="margin-top:6px"><span>${T(x.t)}</span><span class="m">${Object.keys(JSON.parse(x.d).att||{}).length} отметок</span><button onclick="rs(${i})">Восстановить</button></div>`).join(''):'<div class="sm m">Пока нет.</div>'}</div>`}
applyTh();
render();tab(0);notif();
</script></body></html>
